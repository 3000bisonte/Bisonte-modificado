// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Prefer Java 17 for source/target compatibility across modules
    tasks.withType(JavaCompile) {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// As a compatibility fallback, force ALL Android modules to compile with Java/Kotlin 17
subprojects { subproj ->
    subproj.afterEvaluate {
        def isAndroidModule = subproj.plugins.hasPlugin('com.android.library') || subproj.plugins.hasPlugin('com.android.application')
        if (isAndroidModule && subproj.hasProperty('android')) {
            println "Applying Java/Kotlin 17 compileOptions to module: ${subproj.path}"
            subproj.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            // Align Kotlin if present
            try {
                subproj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
                    if (task.kotlinOptions) {
                        task.kotlinOptions.jvmTarget = '17'
                    }
                }
            } catch (Throwable ignored) {
                // Kotlin may not be applied on this module
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

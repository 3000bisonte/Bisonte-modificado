\"448\",\"static/chunks/448-4f937cad2075d2ba.js\",\"586\",\"static/chunks/586-c517dcd4faeb2c4f.js\",\"169\",\"static/chunks/169-e333750d6b87b8d0.js\",\"185\",\"static/chunks/app/layout-36fd0036e70072cc.js\"],\"default\"]\nf:I[6957,[\"448\",\"static/chunks/448-4f937cad2075d2ba.js\",\"586\",\"static/chunks/586-c517dcd4faeb2c4f.js\",\"169\",\"static/chunks/169-e333750d6b87b8d0.js\",\"185\",\"static/chunks/app/layout-36fd0036e70072cc.js\"],\"default\"]\n11:I[1060,[],\"\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L3\",null,{\"buildId\":\"2GoTjpzYj8Iy-xa-j7quq\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"terminos\",\"\"],\"initialTree\":[\"\",{\"children\":[\"terminos\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"terminos\",{\"children\":[\"__PAGE__\",{},[[\"$L4\",[\"$\",\"div\",null,{\"className\":\"min-h-screen bg-gradient-to-br from-teal-50 to-blue-100 flex flex-col items-center py-8 px-2\",\"children\":[\"$\",\"div\",null,{\"className\":\"w-full max-w-3xl bg-white rounded-2xl shadow-2xl border border-gray-100 p-8 overflow-y-auto\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-2xl font-bold text-teal-600 mb-4 text-center\",\"children\":\"Términos y Condiciones\"}],[\"$\",\"section\",null,{\"className\":\"mb-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-semibold text-gray-700\",\"children\":\"Condiciones Generales\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"Este documento describe los términos y condiciones generales para el uso de la plataforma de autogestión de BISONTE, mediante el cual personas naturales o jurídicas, en adelante “Usuarios”, podrán acceder a los diferentes servicios descritos en estos términos y condiciones, lo anterior a través de la actual aplicación.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"La utilización de la plataforma de autogestión atribuye la condición de usuario y expresa la aceptación plena y sin reservas del Usuario de todas y cada una de las Condiciones en la versión publicada en el momento mismo en que el Usuario acceda al Portal de autogestión. En consecuencia, el Usuario debe leer atentamente los términos y condiciones generales en cada una de las ocasiones en que se proponga utilizar la plataforma de autogestión.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"La utilización de los servicios ofrecidos a los Usuarios a través de la plataforma de autogestión se encuentra sometida a condiciones particulares propias que, según los casos, sustituyen, completan y/o modifican las Condiciones Generales (en adelante, las “Condiciones Particulares de los atributos). Con anterioridad a la utilización de dichos servicios, el Usuario también ha de leer atentamente las correspondientes Condiciones Particulares.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"Asimismo, la utilización del Servicio se encuentra sometida igualmente a todos los avisos, reglamentos de uso e instrucciones puestos en conocimiento del Usuario por Bisonte, que completan lo previsto en estos términos y condiciones en cuanto no se opongan a ella.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"El uso de la plataforma de autogestión es inherente a los servicios de mensajería expresa y/o carga, prestados por BISONTE, y deberán usarse de manera integral.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"BISONTE se reserva el derecho de admisión y permanencia de los usuarios registrados en el portal de Autogestión.\"}]]}],[\"$\",\"section\",null,{\"className\":\"mb-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-semibold text-gray-700\",\"children\":\"Condiciones de Acceso y Utilización de la Plataforma de Autogestión\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"Para acceder a los servicios y demás funcionalidades ofertadas por BISONTE, a través de su plataforma de autogestión, es obligatorio generar el registro en la presente aplicación móvil. El usuario registrará una dirección de correo electrónico o número celular de uso personal y una contraseña, los cuales permitirán el acceso a la aplicación.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"Adicionalmente, durante el registro, se solicitarán datos personales básicos incluyendo nombre, dirección, ciudad, teléfono, entre otros, los cuales podrán ser modificados por el usuario a través del panel de configuración de la plataforma de autogestión en cualquier momento; el usuario garantiza y responde, en cualquier caso, por la exactitud, veracidad, vigencia y autenticidad de los Datos Personales ingresados.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"Una vez registrado en la plataforma de Autogestión de BISONTE, el usuario deberá identificarse del mismo modo que haya quedado su registro (nombres y número de identificación) en todo y cada uno de los envíos de mensajería y carga que pretenda remitir por medio de la red logística de BISONTE, es decir, cuando actúe en calidad de Remitente. En este sentido, se obliga a no generar envíos – es decir, a identificarse como remitente – a nombre de terceros, establecimientos de comercio, seudónimos, entre otros; en especial para aquellos servicios que tengan el atributo pago en casa.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"En el evento que el usuario omita este procedimiento, y tal novedad dificulte los procedimientos internos de BISONTE, se reserva el derecho de solicitar documentación adicional a fin de verificar la titularidad del envío y en el caso que la misma no pueda ser validada, se exime de responsabilidad alguna para generar la devolución del pago en casa por información falsa e inexacta.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"El usuario se obliga a mantener la confidencialidad de su contraseña de acceso, la cual le permite acceder a servicios y obtener información de la cuenta. Dicha Clave es de uso personal, y su entrega a terceros no involucra responsabilidad de BISONTE en caso de uso indebido, negligente y/o incorrecto.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"Cada usuario sólo podrá contar con un (1) registro en el portal de autogestión, absteniéndose de acceder a más de un (1) registro con distintos usuarios o falseando, modificando y/o alterando sus datos personales de cualquier manera posible. Si se verifica o sospecha el uso fraudulento y/o malintencionado y/o contrario a estos Términos y Condiciones y/o contrarios a la buena fe, BISONTE tendrá el derecho inapelable de dar de baja las cuentas y/o de iniciar las acciones judiciales que sean pertinentes.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"BISONTE se reserva el derecho de solicitar algún comprobante y/o dato adicional a efectos de corroborar los datos personales, así como de suspender temporal o definitivamente a aquellos clientes cuyos datos y/o identidad no hayan podido ser confirmados.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"El usuario podrá además inscribirse a través de aplicaciones de terceros, tales como, pero sin limitarse a: Facebook, Google, Instagram o Twitter (en adelante “Aplicaciones de Terceros”). En este caso, el Cliente autoriza y entiende que BISONTE podrá recopilar otro tipo de información que esté disponible en su(s) cuenta(s) registrada(s) en las Aplicaciones de Terceros, tales como, pero sin limitarse a nombre y apellidos, foto(s) de perfil, país y ciudad de residencia, correo electrónico, teléfono y fecha de nacimiento, entre otros. El usuario declara entender y aceptar que las Aplicaciones de Terceros tienen sus propios términos y condiciones de uso y políticas de privacidad sin que BISONTE tenga ninguna injerencia sobre las mismas, ni sobre las características, actividades, anuncios, comportamientos y/o contenidos publicados, y mucho menos sobre las transacciones que el usuario pueda realizar a través de dichas aplicaciones de terceros.\"}]]}],[\"$\",\"section\",null,{\"className\":\"mb-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-semibold text-gray-700\",\"children\":\"Obligaciones de Bisonte\"}],[\"$\",\"ul\",null,{\"className\":\"list-decimal list-inside text-gray-600 mt-2\",\"children\":[[\"$\",\"li\",null,{\"children\":\"Tener a disposición de los usuarios el aplicativo de plataforma de Autogestión en la presente aplicación u otros mecanismos que determine, de conformidad con el sistema operativo Android o publicados en la misma plataforma.\"}],[\"$\",\"li\",null,{\"children\":\"Garantizar el funcionamiento de los atributos acá indicados con fundamento en lo aquí descrito.\"}],[\"$\",\"li\",null,{\"children\":\"Suministrar información precisa y actualizada acerca de los servicios que presta y, en particular, de las condiciones de acceso, tarifas, cobertura, frecuencia, tiempo de entrega del objeto postal y/o de carga, niveles de calidad, y procedimiento para la atención y trámite de las PQRS.\"}],[\"$\",\"li\",null,{\"children\":\"Prestar el Servicio sin discriminación alguna entre los usuarios que se encuentren en condiciones análogas y conformidad a la matriz logística determinada.\"}],[\"$\",\"li\",null,{\"children\":\"Prestar el servicio bajo el cumplimiento de las condiciones ofrecidas y las características inherentes o propias de cada servicio.\"}]]}]]}],[\"$\",\"section\",null,{\"className\":\"mb-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-semibold text-gray-700\",\"children\":\"Obligaciones de los Usuarios\"}],[\"$\",\"ul\",null,{\"className\":\"list-decimal list-inside text-gray-600 mt-2\",\"children\":[[\"$\",\"li\",null,{\"children\":\"Cumplir cabalmente los compromisos contractuales adquiridos.\"}],[\"$\",\"li\",null,{\"children\":\"Suministrar información real y verídica para la prestación de los servicios y atributos.\"}],[\"$\",\"li\",null,{\"children\":\"Identificarse ante BISONTE, con su tarjeta de identidad, cédula de ciudadanía, cédula de extranjería o pasaporte como requisito previo a la admisión.\"}],[\"$\",\"li\",null,{\"children\":\"Pagar la tarifa del servicio y/o atributo contratado.\"}],[\"$\",\"li\",null,{\"children\":\"Abstenerse de enviar objetos prohibidos o peligrosos, de acuerdo con las normas vigentes.\"}],[\"$\",\"li\",null,{\"children\":\"Abstenerse de generar envíos en nombre de terceros sin autorización.\"}],[\"$\",\"li\",null,{\"children\":\"Validar al momento de la admisión del envío que los datos registrados en la guía de transporte/remesa sean correctos y concuerden con los datos registrados en la plataforma de autogestión.\"}]]}]]}],[\"$\",\"section\",null,{\"className\":\"mb-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-semibold text-gray-700\",\"children\":\"Continuidad de los Servicios de Mensajería Expresa o de Carga\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"El uso de la plataforma de autogestión es inherente a los servicios de mensajería expresa y/o carga, prestados por BISONTE, y deberán usarse de manera integral.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"A partir de la admisión de una pieza postal o de carga, entendiéndose esto como la recepción y custodia por parte de un colaborador de BISONTE del envío, aplicarán las condiciones de la prestación de servicio dispuestas en los contratos de mensajería expresa o de transporte de cosas, según el servicio solicitado por el usuario.\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2 font-semibold\",\"children\":\"Parágrafo:\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"El usuario que solicite el servicio de transporte manifiesta conocer los contratos de prestación de los servicios de mensajería expresa y de carga, por lo que declara conocer las condiciones de los servicios, y se abstendrá de realizar una solicitud si desconoce los mismos.\"}]]}],[\"$\",\"section\",null,{\"className\":\"mb-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-xl font-semibold text-gray-700\",\"children\":\"Trámite de PQR\"}],[\"$\",\"p\",null,{\"className\":\"text-gray-600 mt-2\",\"children\":\"Los USUARIOS podrán interponer una petición, queja o recurso o solicitudes de la siguiente manera:\"}],[\"$\",\"ul\",null,{\"className\":\"list-disc list-inside text-gray-600 mt-2\",\"children\":[[\"$\",\"li\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"font-semibold\",\"children\":\"Medios de Presentación:\"}],\" Por medio de solicitud enviada a través de la presente plataforma.\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"font-semibold\",\"children\":\"Contenido de la PQR:\"}],\" Para atender la solicitud de una manera idónea deberá consignar como mínimo: Nombre e identificación del Usuario, Número de Guía, fecha de imposición del envío, los hechos en que se fundamenta su solicitud, dirección física y de correo electrónico. Deberá anexar, si es el caso, copia del documento de identificación y copia simple y legible de la guía que amparó el envío.\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"font-semibold\",\"children\":\"Término para Interponer Solicitudes de Indemnización:\"}],[\"$\",\"ul\",null,{\"className\":\"list-disc list-inside ml-6\",\"children\":[[\"$\",\"li\",null,{\"children\":\"Por pérdida, expoliación o avería, será:\"}],[\"$\",\"li\",null,{\"children\":\"a) Por parte del remitente, dentro de los 10 días calendario siguientes a la admisión del objeto postal, para servicios nacionales, y 2 meses para servicios internacionales.\"}],[\"$\",\"li\",null,{\"children\":\"b) Por parte del destinatario, deberá ser presentado dentro de los cinco (5) días hábiles siguientes al recibo del objeto postal.\"}]]}]]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"font-semibold\",\"children\":\"Decisión:\"}],\" Una vez se ha recibido la PQR o la solicitud de indemnización, BISONTE generará la respuesta dentro de los 30 días hábiles siguientes.\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"font-semibold\",\"children\":\"Notificación:\"}],\" BISONTE remitirá la respuesta a la PQR o solicitud de indemnización por correo electrónico y/o físico, considerando el medio utilizado por el USUARIO para la radicación de la solicitud.\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"font-semibold\",\"children\":\"Recursos:\"}],\" De conformidad con la normatividad vigente, el usuario, en caso de inconformidad con la respuesta emitida por BISONTE, podrá interponer los recursos de reposición y, en subsidio, el de apelación, de la siguiente manera:\",[\"$\",\"ul\",null,{\"className\":\"list-disc list-inside ml-6\",\"children\":[[\"$\",\"li\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"font-semibold\",\"children\":\"Recurso de reposición:\"}],\" Se interpone dentro de los diez (10) días hábiles siguientes a la fecha en que se notifica la decisión al usuario, ante BISONTE.\"]}],[\"$\",\"li\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"font-semibold\",\"children\":\"Recurso de Apelación:\"}],\" Se debe interponer en subsidio del recurso de reposición al momento de la presentación del mismo. En caso de que la respuesta de BISONTE al recurso de reposición sea desfavorable a las pretensiones del usuario, el operador postal remitirá copia de toda la actuación a la Superintendencia de Industria y Comercio, entidad que resolverá de manera definitiva la solicitud.\"]}]]}]]}]]}]]}]]}]}],null],null],null]},[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"terminos\",\"children\"],\"error\":\"$undefined\",\"errorStyles\"
